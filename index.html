<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SOPHIA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: linear-gradient(145deg, #1e1a2e 0%, #2a1f3a 100%);
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      color: #f0e6ff;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(255, 215, 150, 0.25);
      padding: 16px 20px 20px;
      width: 100%;
      max-width: 700px;
      max-height: 98vh;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }

    h1 {
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: 800;
      letter-spacing: 6px;
      text-align: center;
      color: #ffdab9;
      text-shadow: 0 0 10px #ffb347, 0 0 30px #b23e8c;
      line-height: 1;
    }

    .subhead {
      color: #d9c7f0;
      font-size: clamp(0.85rem, 2.5vw, 1.1rem);
      text-align: center;
      font-weight: 300;
      letter-spacing: 1.5px;
      border-bottom: 1px dashed rgba(255, 215, 150, 0.4);
      padding-bottom: 8px;
      flex-shrink: 0;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      flex-shrink: 0;
    }

    .choice-btn {
      background: #2f2444;
      border: 2px solid #a378c8;
      border-radius: 40px;
      padding: 12px 8px;
      font-size: clamp(1rem, 3.5vw, 1.4rem);
      font-weight: 700;
      color: #f0e6ff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 5px 0 #0e0a18;
      cursor: pointer;
      transition: transform 0.05s, background 0.1s;
      letter-spacing: 0.5px;
      user-select: none;
    }

    .choice-btn:hover {
      background: #3e2d5a;
      border-color: #f5b042;
    }

    .choice-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #0e0a18;
    }

    .emoji-big {
      font-size: clamp(1.3rem, 4.5vw, 1.8rem);
    }

    .result-panel {
      flex: 1;
      min-height: 0;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 24px;
      padding: 14px;
      border: 2px solid rgba(255, 200, 120, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .result-text {
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      font-weight: 700;
      color: #ffeac2;
      text-shadow: 0 0 8px #ffb86b;
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .result-emoji {
      font-size: clamp(3rem, 12vw, 5rem);
      line-height: 1;
      filter: drop-shadow(0 0 15px #ffb347);
    }

    /* password screen */
    .password-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .password-label {
      font-size: clamp(0.9rem, 3vw, 1.1rem);
      color: #e9d6ff;
      text-align: center;
    }

    .password-input {
      padding: 10px 16px;
      font-size: 1.2rem;
      border-radius: 30px;
      border: 2px solid #b387e0;
      background: #1f152b;
      color: #fff4e0;
      text-align: center;
      letter-spacing: 4px;
      width: min(220px, 80%);
      outline: none;
      font-weight: 600;
    }

    .password-input:focus {
      border-color: #ffb347;
      box-shadow: 0 0 15px #ffb347;
    }

    .password-submit {
      background: #ffb347;
      border: none;
      border-radius: 30px;
      padding: 10px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #1e1427;
      cursor: pointer;
      box-shadow: 0 4px 0 #9e6b1f;
      letter-spacing: 1px;
    }

    .password-submit:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #9e6b1f;
    }

    .error-msg {
      color: #ff9e9e;
      font-size: 0.9rem;
      font-weight: 500;
      min-height: 18px;
    }

    /* video */
    .video-wrapper {
      width: 100%;
      max-height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      display: block;
      width: 100%;
      max-width: min(360px, 70vw);
      max-height: 40vh;
      border-radius: 20px;
      border: 3px solid #ffcf9a;
      background: #0c0714;
      object-fit: cover;
    }

    .back-btn {
      background: transparent;
      border: 2px solid #a378c8;
      color: #d9c7f0;
      font-size: 0.95rem;
      padding: 8px 20px;
      border-radius: 30px;
      margin-top: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .back-btn:hover {
      background: #3e2d5a;
      border-color: #f5b042;
      color: white;
    }

    /* very small screens — keep everything visible */
    @media (max-height: 640px) {
      h1 { font-size: 2rem; letter-spacing: 4px; }
      .choice-btn { padding: 8px 6px; font-size: 0.95rem; }
      .emoji-big { font-size: 1.2rem; }
      video { max-height: 32vh; }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>SOPHIA</h1>
    <div class="subhead">✨ who do you look like today? ✨</div>

    <div class="choices">
      <button class="choice-btn" data-choice="goat">
        <span class="emoji-big">🐐</span> GOAT
      </button>
      <button class="choice-btn" data-choice="zebra">
        <span class="emoji-big">🦓</span> ZEBRA
      </button>
      <button class="choice-btn" data-choice="beautiful">
        <span class="emoji-big">🌸</span> BEAUTIFUL
      </button>
      <button class="choice-btn" data-choice="monkey">
        <span class="emoji-big">🐒</span> MONKEY
      </button>
    </div>

    <div id="resultPanel" class="result-panel">
      <div id="resultContent" style="width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;">
        <div class="result-text">👆 tap a vibe</div>
        <div class="result-emoji">🎵</div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const resultContent = document.getElementById('resultContent');

      // ⚠️ CHANGE THIS to your own video file name or link
      const SOPHIA_VIDEO_SRC = "sofi.mp4.mp4";

      // ---- AUDIO ----
      let audioCtx = null;
      function getAudioContext() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
      }

      function playSound(type) {
        try {
          const ctx = getAudioContext();
          const now = ctx.currentTime;

          if (type === 'goat') {
            beep(ctx, 320, 420, now, 0.12, 'square', 0.15);
            beep(ctx, 300, 400, now + 0.22, 0.13, 'square', 0.12);
          } else if (type === 'zebra') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(700, now);
            osc.frequency.linearRampToValueAtTime(950, now + 0.15);
            osc.frequency.linearRampToValueAtTime(800, now + 0.35);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
            osc.connect(gain).connect(ctx.destination);
            osc.start(now); osc.stop(now + 0.5);
          } else if (type === 'beautiful') {
            [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
              beep(ctx, f, f, now + i * 0.08, 0.1, 'triangle', 0.12);
            });
          } else if (type === 'monkey') {
            beep(ctx, 820, 1100, now, 0.1, 'sawtooth', 0.1);
            beep(ctx, 880, 1200, now + 0.14, 0.1, 'sawtooth', 0.1);
          }
        } catch (e) { /* silent */ }
      }

      function beep(ctx, f1, f2, start, dur, wave, vol) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = wave;
        osc.frequency.setValueAtTime(f1, start);
        osc.frequency.exponentialRampToValueAtTime(f2, start + dur);
        gain.gain.setValueAtTime(vol, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + dur + 0.08);
        osc.connect(gain).connect(ctx.destination);
        osc.start(start);
        osc.stop(start + dur + 0.1);
      }

      // ---- SCREENS ----
      function showDefault() {
        resultContent.innerHTML = `
          <div class="result-text">👆 tap a vibe</div>
          <div class="result-emoji">🎵</div>
        `;
      }

      function showSimple(choice) {
        const map = {
          goat:    { t: 'Sophia, you look like a GOAT!',   e: '🐐' },
          zebra:   { t: 'Sophia, you look like a ZEBRA!',  e: '🦓' },
          monkey:  { t: 'Sophia, you look like a MONKEY!', e: '🐒' }
        };
        const m = map[choice];
        resultContent.innerHTML = `
          <div class="result-text">${m.t}</div>
          <div class="result-emoji">${m.e}</div>
        `;
      }

      function showPasswordScreen() {
        resultContent.innerHTML = `
          <div class="password-screen">
            <div class="password-label">🔐 enter password</div>
            <input type="password" id="pwdInput" class="password-input" placeholder="••••••" autocomplete="off">
            <button id="pwdSubmit" class="password-submit">UNLOCK</button>
            <div id="pwdError" class="error-msg"></div>
          </div>
        `;
        const inp = document.getElementById('pwdInput');
        const btn = document.getElementById('pwdSubmit');
        const err = document.getElementById('pwdError');
        inp.focus();

        inp.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); btn.click(); }
        });

        btn.addEventListener('click', () => {
          if (inp.value.trim() === 'charm') {
            showVideo();
          } else {
            err.textContent = '❌ wrong, try "charm"';
            inp.value = '';
            inp.focus();
            // error beep
            try {
              const ctx = getAudioContext();
              beep(ctx, 220, 180, ctx.currentTime, 0.18, 'sine', 0.08);
            } catch(e){}
          }
        });
      }

      function showVideo() {
        playSound('beautiful');

        resultContent.innerHTML = `
          <div style="width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;">
            <div class="result-text" style="font-size:1.2rem;">🌸 Sophia, you are BEAUTIFUL 🌸</div>
            <div class="video-wrapper">
              <video id="sophiaVideo" autoplay loop playsinline controls>
                <source src="${SOPHIA_VIDEO_SRC}" type="video/mp4">
              </video>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">
              <button id="unmuteBtn" class="back-btn">🔊 Unmute</button>
              <button id="backBtn" class="back-btn">↺ Back</button>
            </div>
          </div>
        `;

        const vid = document.getElementById('sophiaVideo');
        if (vid) {
          vid.muted = false;
          vid.volume = 1.0;
          vid.play().catch(() => {
            vid.muted = true;
            vid.play().catch(()=>{});
          });
          vid.addEventListener('error', () => {
            resultContent.innerHTML = `
              <div class="result-text">Sophia, you are BEAUTIFUL</div>
              <div class="result-emoji">🌸✨</div>
              <button id="backBtn" class="back-btn">↺ Back</button>
            `;
            document.getElementById('backBtn').onclick = showDefault;
          });
        }

        document.getElementById('unmuteBtn').onclick = () => {
          const v = document.getElementById('sophiaVideo');
          if (v) { v.muted = false; v.volume = 1.0; v.play(); }
        };
        document.getElementById('backBtn').onclick = showDefault;
      }

      // ---- MAIN HANDLER ----
      function handleChoice(choice) {
        getAudioContext(); // unlock audio instantly

        if (choice === 'beautiful') {
          // quick tap sparkle
          try {
            const ctx = getAudioContext();
            beep(ctx, 880, 880, ctx.currentTime, 0.1, 'sine', 0.08);
          } catch(e){}
          showPasswordScreen();
        } else {
          playSound(choice);
          showSimple(choice);
        }
      }

      // ---- BIND BUTTONS ----
      document.querySelectorAll('.choice-btn').forEach(btn => {
        btn.addEventListener('click', () => handleChoice(btn.dataset.choice));
      });

      // unlock audio on first tap anywhere
      document.addEventListener('click', () => getAudioContext(), { once: true });

      showDefault();
    })();
  </script>

</body>
</html>
