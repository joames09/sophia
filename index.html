<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SOPHIA</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1e1a2e;
    font-family: Arial, sans-serif;
    color: #fff;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .wrap {
    width: 100vw;
    height: 100vh;
    max-width: 640px;
    max-height: 900px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  h1 {
    font-size: 2.2rem;
    text-align: center;
    color: #ffdab9;
    letter-spacing: 6px;
    text-shadow: 0 0 15px #ff8c42;
    line-height: 1;
    flex-shrink: 0;
  }

  .sub {
    text-align: center;
    color: #d9c7f0;
    font-size: 0.85rem;
    letter-spacing: 1px;
    padding-bottom: 6px;
    border-bottom: 1px dashed rgba(255,215,150,0.3);
    flex-shrink: 0;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 6px;
    flex-shrink: 0;
    height: 34%;
    min-height: 130px;
  }

  .btn {
    background: #2f2444;
    border: 2px solid #a378c8;
    border-radius: 20px;
    color: #f0e6ff;
    font-size: 1.05rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
    padding: 4px;
    /* NO transitions - instant */
  }

  .btn:active {
    background: #f5b042;
    color: #1e1427;
    border-color: #f5b042;
  }

  .btn span:first-child {
    font-size: 1.6rem;
  }

  .panel {
    flex: 1;
    min-height: 0;
    background: #0e0a18;
    border: 2px solid rgba(255,200,120,0.5);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px;
    overflow: hidden;
    position: relative;
  }

  .big-text {
    font-size: 1.3rem;
    font-weight: 700;
    color: #ffeac2;
    margin-bottom: 6px;
    line-height: 1.2;
    padding: 0 8px;
  }

  .big-emoji {
    font-size: 4rem;
    line-height: 1;
  }

  /* password form */
  .pwd-form {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
  }

  .pwd-form label {
    font-size: 0.95rem;
    color: #e9d6ff;
  }

  .pwd-form input {
    padding: 8px 14px;
    font-size: 1.1rem;
    border-radius: 20px;
    border: 2px solid #b387e0;
    background: #1f152b;
    color: #fff;
    text-align: center;
    letter-spacing: 3px;
    width: 180px;
    outline: none;
  }

  .pwd-form input:focus {
    border-color: #ffb347;
  }

  .pwd-form button {
    background: #ffb347;
    border: none;
    border-radius: 20px;
    padding: 8px 26px;
    font-size: 1rem;
    font-weight: bold;
    color: #1e1427;
    cursor: pointer;
  }

  .pwd-form button:active {
    background: #d9941f;
  }

  .err {
    color: #ff9e9e;
    font-size: 0.85rem;
    height: 14px;
  }

  /* video */
  video {
    width: 100%;
    max-width: 340px;
    max-height: 100%;
    border-radius: 14px;
    border: 2px solid #ffcf9a;
    background: #000;
    object-fit: contain;
  }

  .row {
    display: flex;
    gap: 6px;
    margin-top: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .mini-btn {
    background: #2f2444;
    border: 2px solid #a378c8;
    color: #d9c7f0;
    font-size: 0.85rem;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 600;
  }

  .mini-btn:active {
    background: #f5b042;
    color: #1e1427;
  }

  @media (max-width: 420px) {
    h1 { font-size: 1.8rem; letter-spacing: 4px; }
    .sub { font-size: 0.75rem; }
    .btn { font-size: 0.9rem; }
    .btn span:first-child { font-size: 1.3rem; }
    .big-emoji { font-size: 3.2rem; }
    .big-text { font-size: 1.1rem; }
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>SOPHIA</h1>
  <div class="sub">✨ who do you look like today? ✨</div>

  <div class="grid">
    <button class="btn" data-pick="goat"><span>🐐</span> GOAT</button>
    <button class="btn" data-pick="zebra"><span>🦓</span> ZEBRA</button>
    <button class="btn" data-pick="beautiful"><span>🌸</span> BEAUTIFUL</button>
    <button class="btn" data-pick="monkey"><span>🐒</span> MONKEY</button>
  </div>

  <div class="panel" id="panel">
    <div class="big-text">👆 tap a vibe</div>
    <div class="big-emoji">🎵</div>
  </div>
</div>

<script>
(function(){
  var panel = document.getElementById('panel');

  // ⚠️ PUT YOUR VIDEO FILE NAME OR LINK HERE
  var VIDEO_SRC = "sofi.mp4.mp4";

  // ---- AUDIO ----
  var ctx = null;
  function audio(){
    if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if(ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function tone(f1, f2, dur, wave, vol, delay){
    try {
      var a = audio();
      var t = a.currentTime + (delay || 0);
      var o = a.createOscillator();
      var g = a.createGain();
      o.type = wave || 'sine';
      o.frequency.setValueAtTime(f1, t);
      if(f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(vol || 0.1, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur + 0.05);
      o.connect(g); g.connect(a.destination);
      o.start(t); o.stop(t + dur + 0.06);
    } catch(e){}
  }

  function soundGoat(){ tone(320, 420, 0.12, 'square', 0.15, 0); tone(300, 400, 0.12, 'square', 0.12, 0.2); }
  function soundZebra(){ tone(700, 950, 0.15, 'sine', 0.15, 0); tone(950, 800, 0.2, 'sine', 0.13, 0.15); }
  function soundBeautiful(){ [523, 659, 784, 1046].forEach(function(f, i){ tone(f, f, 0.15, 'triangle', 0.1, i * 0.08); }); }
  function soundMonkey(){ tone(820, 1100, 0.09, 'sawtooth', 0.1, 0); tone(880, 1200, 0.09, 'sawtooth', 0.1, 0.13); }
  function soundError(){ tone(220, 180, 0.18, 'sine', 0.08, 0); }

  // ---- SCREENS ----
  function showDefault(){
    panel.innerHTML = '<div class="big-text">👆 tap a vibe</div><div class="big-emoji">🎵</div>';
  }

  function showSimple(pick){
    var data = {
      goat:    ['Sophia, you look like a GOAT!',   '🐐'],
      zebra:   ['Sophia, you look like a ZEBRA!',  '🦓'],
      monkey:  ['Sophia, you look like a MONKEY!', '🐒']
    }[pick];
    panel.innerHTML = '<div class="big-text">' + data[0] + '</div><div class="big-emoji">' + data[1] + '</div>';
  }

  function showPassword(){
    panel.innerHTML =
      '<div class="pwd-form">' +
        '<label>🔐 enter password</label>' +
        '<input type="password" id="pwd" placeholder="••••••" autocomplete="off">' +
        '<button id="go">UNLOCK</button>' +
        '<div class="err" id="err"></div>' +
      '</div>';

    var inp = document.getElementById('pwd');
    var btn = document.getElementById('go');
    var err = document.getElementById('err');
    inp.focus();

    inp.onkeydown = function(e){ if(e.key === 'Enter'){ e.preventDefault(); btn.click(); } };
    btn.onclick = function(){
      if(inp.value.trim() === 'joames'){
        showVideo();
      } else {
        err.textContent = '❌ wrong, try "🫵"';
        inp.value = '';
        inp.focus();
        soundError();
      }
    };
  }

  function showVideo(){
    soundBeautiful();

    panel.innerHTML =
      '<div style="width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:100%">' +
        '<div class="big-text" style="font-size:1rem">🌸 Sophia, you are BEAUTIFUL 🌸</div>' +
        '<video id="vid" autoplay loop playsinline controls>' +
          '<source src="' + VIDEO_SRC + '" type="video/mp4">' +
        '</video>' +
        '<div class="row">' +
          '<button class="mini-btn" id="unmute">🔊 Unmute</button>' +
          '<button class="mini-btn" id="back">↺ Back</button>' +
        '</div>' +
      '</div>';

    var v = document.getElementById('vid');
    v.muted = false;
    v.volume = 1;
    v.play().catch(function(){
      v.muted = true;
      v.play().catch(function(){});
    });

    v.onerror = function(){
      panel.innerHTML =
        '<div class="big-text">Sophia, you are BEAUTIFUL</div>' +
        '<div class="big-emoji">🌸✨</div>' +
        '<div class="row"><button class="mini-btn" id="back">↺ Back</button></div>';
      document.getElementById('back').onclick = showDefault;
    };

    document.getElementById('unmute').onclick = function(){
      v.muted = false;
      v.volume = 1;
      v.play();
    };
    document.getElementById('back').onclick = showDefault;
  }

  // ---- MAIN ----
  function pick(choice){
    audio(); // unlock sound immediately

    if(choice === 'beautiful'){
      showPassword();
    } else {
      if(choice === 'goat') soundGoat();
      else if(choice === 'zebra') soundZebra();
      else if(choice === 'monkey') soundMonkey();
      showSimple(choice);
    }
  }

  // bind buttons - use direct onclick for speed
  var btns = document.querySelectorAll('.btn');
  for(var i = 0; i < btns.length; i++){
    (function(b){
      b.onclick = function(){ pick(b.getAttribute('data-pick')); };
    })(btns[i]);
  }

  // unlock audio once
  document.addEventListener('touchstart', function(){ audio(); }, { once: true, passive: true });
  document.addEventListener('click', function(){ audio(); }, { once: true });

})();
</script>

</body>
</html>
